
name: AI Vietlott 645

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Check dependencies
        run: |
          python -c "import numpy, pandas, requests; print('ALL LIBRARIES OK')"

      - name: Run Engine A V14
        run: python engine_a_v14.py
